name: Test & Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "fixtures/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"

# defaults:
#   run:
#     working-directory: ./web
env:
  REGISTRY: ghcr.io
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          pip install --only-binary :all: ruff==0.15.20

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

  test:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes \
            --only-binary :all: \
            --no-binary cbor \
            -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        uses: ./.github/actions/docker-build
        with:
          registry: ${{ env.REGISTRY }}
          image_name: "${{ github.repository }}/controller"
          context: ./
          dockerfile: "Dockerfile"
          docker_user: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
