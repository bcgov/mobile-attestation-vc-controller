# Default values for attestation-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
podLabels: {}

image:
  pullPolicy: IfNotPresent
  registry: artifacts.developer.gov.bc.ca/github-docker-remote
  # registry: ghcr.io
  repository: bcgov/mobile-attestation-vc-controller/controller
  # Overrides the image tag whose default is the chart appVersion.
  tag: "68a3892"

netpol:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bc0192-prod

env:
  TRACTION_BASE_URL: "https://traction-tenant-proxy-prod.apps.silver.devops.gov.bc.ca"
  APPLE_ATTESTATION_ROOT_CA_URL: "https://www.apple.com/certificateauthority/Apple_App_Attestation_Root_CA.pem"
  GOOGLE_AUTH_JSON_PATH: "/opt/controller/google_oauth_key.json"
  MESSAGE_TEMPLATES_PATH: "/opt/fixtures/"
  # This is needed for Google Play verificaiton to accept
  # non-production playstore builds.
  ALLOW_TEST_BUILDS: "false"
  # Prod accepts only the production bundles. IDs come from
  # variants/{bcsc-prod,bcwallet-prod}/variant.env in the wallet repo.
  ALLOWED_APPLE_APP_IDS: "L796QSLV3E.ca.bc.gov.BCWallet,L796QSLV3E.ca.bc.gov.id.servicescard"
  ALLOWED_GOOGLE_PACKAGE_NAMES: "ca.bc.gov.BCWallet,ca.bc.gov.id.servicescard"
  # Every environment issues over issue-credential 1.0 by default; a client asks
  # for v2 by sending credential_protocol in its attestation request.
  DEFAULT_CREDENTIAL_PROTOCOL: "v1"
  # Attestation cred defs this deployment may issue. The one whose issuer DID
  # matches the tenant's traction_legacy_did is the one used, so all environments
  # can carry the same list; narrow it per environment if you prefer.
  ATTESTATION_CRED_DEF_IDS: "NXp6XcGeCR2MviWuY51Dva:3:CL:33557:bcwallet_dev_v2,RycQpZ9b4NaXuT5ZGjXkUE:3:CL:120:bcwallet_test_v2,XqaRXJt4sXE6TRpfGpVbGw:3:CL:655:bcwallet"

resources:
  requests:
    memory: 92Mi
    cpu: 10m
  limits:
    memory: 128Mi

imagePullSecrets:
  - name: artifactory-regcred

service:
  targetPort: 5000

route:
  host: ""
  annotations:
    haproxy.router.openshift.io/timeout: 60s

# serviceAccount:
#   # Specifies whether a service account should be created
#   create: true
#   # Automatically mount a ServiceAccount's API credentials?
#   automount: true
#   # Annotations to add to the service account
#   annotations: {}
#   # The name of the service account to use.
#   # If not set and create is true, a name is generated using the fullname template
#   name: ""

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
