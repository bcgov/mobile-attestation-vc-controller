[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W) and import sorting (I) — the flake8 replacement.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Bootstrap scripts mutate sys.path before importing from src.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
# src/ holds the importable modules (apple, goog, constants, ...).
pythonpath = ["src"]
testpaths = ["tests"]
